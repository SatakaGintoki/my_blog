server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /api/ {
        proxy_pass http://blog:8000;
        proxy_set_header Host $host;
    }
    location ^~ /uploads/ {
        proxy_pass http://blog:8000;
        proxy_set_header Host $host;
    }
    location = /health { proxy_pass http://blog:8000; }
    location = /openapi.json { proxy_pass http://blog:8000; }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        # A missing static resource must not return the SPA HTML document.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.(?:png|jpe?g|webp|svg|woff2?|txt)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }
}
